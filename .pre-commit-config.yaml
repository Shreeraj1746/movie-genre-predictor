repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-toml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.13.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python)

  # Local hooks to generate Terraform docs and run Python tests
  - repo: local
    hooks:
      - id: terraform-docs-local
        name: terraform-docs-local
        description: Generate Terraform module documentation
        language: system
        entry: ./scripts/generate_terraform_docs.sh
        pass_filenames: false
        files: ^terraform/.*\.tf$
        exclude: \.terraform/.*$
        stages: [commit]  # Only run on commits, not in CI

      - id: pytest-check
        name: pytest-check
        language: system
        entry: python -m pytest tests/ --verbose --cov=src
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [push, manual]

      - id: integration-test
        name: integration-test
        language: system
        entry: python run_integration_test.py --mode test
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [push, manual]
